[project]
name = "answer-probe"
version = "0.1.0"
description = "Do a language model's hidden states predict a wrong answer before it is given? Linear probes in JAX on Gemma residual streams."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Oscar Dalton", email = "daltonoscar0@gmail.com" }]
keywords = ["interpretability", "reliability", "probing", "jax", "gemma", "hallucination"]
dependencies = [
    "jax>=0.4.35",
    "jaxlib>=0.4.35",
    # bfloat16 as a numpy dtype, for reading the activation files. Comes with
    # jax, but io.py imports it directly so it is named directly.
    "ml-dtypes>=0.4",
    "optax>=0.2.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Only needed to run notebooks/extract.ipynb (Colab) or the tiny-model
# extraction test. `gemma` pulls in kauldron/tensorflow-cpu and is heavy.
extract = ["gemma>=3.0", "datasets>=2.19", "huggingface-hub>=0.23"]

[project.scripts]
aprobe = "answer_probe.cli:main"

[project.urls]
Homepage = "https://github.com/daltonoscar0/answer-probe"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/answer_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
